name: 🔧 Compile Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: compile-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FIREFLY_CLOUD_API_ROOT: ${{ vars.FIREFLY_CLOUD_API_ROOT }}

jobs:
  compile:
    name: Compile Firmware
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Read build variables
        run: |
          echo "VERSION_ESP_Core=$(yq -r '.cores[] | select(.name == "esp8266:esp8266") | .version' libraries.yaml)" >> $GITHUB_ENV
          FIRST_DEVICE=$(yq -o=json '.devices[] | select(.status == "ACTIVE")' devices.yaml | jq -rs '.[0]')
          echo "PRODUCT_HEX=$(echo "$FIRST_DEVICE" | jq -r '.product_hex')" >> $GITHUB_ENV
          FQBN=$(echo "$FIRST_DEVICE" | jq -r '
            .board_fqbn + ":" + (
              .board_options | to_entries | map(.key + "=" + .value) | join(",")
            )
          ')
          echo "FQBN=$FQBN" >> $GITHUB_ENV

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: 1.4.1

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index

      - name: Install ESP8266 core
        run: arduino-cli core install esp8266:esp8266@${{ env.VERSION_ESP_Core }}

      - name: Enable unsafe library install
        run: arduino-cli config set library.enable_unsafe_install true

      - name: Install libraries
        run: |
          yq -r '.libraries[] | .url + ".git#" + .version' libraries.yaml | \
            xargs -I{} arduino-cli lib install --git-url {}

      - name: Compile Client
        run: |
          arduino-cli compile \
            -b "${{ env.FQBN }}" ./Client \
            --warnings more --clean \
            --build-property "build.extra_flags=-DPRODUCT_HEX=${{ env.PRODUCT_HEX }} -DDISABLE_ALL_LIBRARY_WARNINGS -DCORE_DEBUG_LEVEL=4 -DVERSION=\"9999.99.99\" -DCOMMIT_HASH=\"${{ github.sha }}\" -I${{ github.workspace }}"

      - name: Fetch TLS certificate for FIREFLY_CLOUD_API_ROOT
        run: |
          if [ -z "$FIREFLY_CLOUD_API_ROOT" ]; then
            echo "❌ FIREFLY_CLOUD_API_ROOT variable is not set"
            exit 1
          fi
          DOMAIN=$(echo "$FIREFLY_CLOUD_API_ROOT" | sed 's|https\?://||' | cut -d/ -f1)
          echo | openssl s_client -connect "${DOMAIN}:443" -servername "${DOMAIN}" -showcerts 2>/dev/null > /tmp/chain.pem
          if [ ! -s /tmp/chain.pem ]; then
            echo "❌ Failed to connect to ${DOMAIN}:443"
            exit 1
          fi
          python3 - <<'PYEOF'
          import re, sys
          from cryptography import x509
          data = open('/tmp/chain.pem', 'rb').read()
          pem_blocks = re.findall(b'-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----', data, re.DOTALL)
          if not pem_blocks:
              print('❌ No certificate blocks found in chain output', file=sys.stderr)
              sys.exit(1)
          chosen = None
          for pem in pem_blocks:
              cert = x509.load_pem_x509_certificate(pem)
              if cert.issuer == cert.subject:
                  chosen = pem
                  print(f'Using self-signed root CA: {cert.subject.rfc4514_string()}')
                  break
          if chosen is None:
              chosen = pem_blocks[-1]
              cert = x509.load_pem_x509_certificate(chosen)
              print(f'No self-signed root in chain; using last cert: {cert.subject.rfc4514_string()}')
          open('/tmp/cloud_cert.pem', 'wb').write(chosen + b'\n')
          PYEOF
          if [ ! -s /tmp/cloud_cert.pem ]; then
            echo "❌ Failed to extract cert for ${DOMAIN}"
            exit 1
          fi
          python3 - <<'PYEOF'
          import os
          lines = open('/tmp/cloud_cert.pem').read().strip().split('\n')
          with open('common/cloudCert.h', 'w') as f:
              f.write('#pragma once\n')
              f.write('static const char FIREFLY_CLOUD_CERT_PEM[] =\n')
              for line in lines:
                  f.write(f'    "{line}\\n"\n')
              f.write('    ;\n')
          PYEOF

      - name: Compile Hardware-Registration-and-Configuration
        run: |
          arduino-cli compile \
            -b "${{ env.FQBN }}" ./Hardware-Registration-and-Configuration \
            --warnings more --clean \
            --build-property "build.extra_flags=-DPRODUCT_HEX=${{ env.PRODUCT_HEX }} -DFIREFLY_CLOUD_API_ROOT=\"${{ env.FIREFLY_CLOUD_API_ROOT }}\" -DDISABLE_ALL_LIBRARY_WARNINGS -DCORE_DEBUG_LEVEL=4 -DVERSION=\"9999.99.99\" -DCOMMIT_HASH=\"${{ github.sha }}\" -I${{ github.workspace }}"
