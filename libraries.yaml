# Arduino cores and libraries used by FireFly Client firmware.
# This is the single source of truth for core/library names, versions, and URLs.
# Changes here are automatically propagated to FireFly-Docs on production builds.
# URL must not include a .git suffix.

cores:
  - name: "esp8266:esp8266"
    version: "3.1.2"
    url: "https://github.com/esp8266/Arduino"

libraries:
  - name: "ArduinoJson"
    version: "v7.4.3"
    url: "https://github.com/bblanchon/ArduinoJson"
  - name: "TBPubSubClient"
    version: "v2.12.1"
    url: "https://github.com/thingsboard/pubsubclient"
  - name: "ESPAsyncTCP"
    version: "v2.0.0"
    url: "https://github.com/ESP32Async/ESPAsyncTCP"
  - name: "ESPAsyncWebServer"
    version: "v3.11.1"
    url: "https://github.com/ESP32Async/ESPAsyncWebServer"
