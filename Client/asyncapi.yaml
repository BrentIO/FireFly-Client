asyncapi: 3.1.0

info:
  title: FireFly Client
  description: MQTT messages published and subscribed to by the FireFly Client firmware
  version: "9999.99.99"

servers:
  mqtt:
    host: "{host}:{port}"
    protocol: mqtt
    description: MQTT broker used by the client
    variables:
      host:
        default: localhost
        description: Hostname or IP address of the MQTT broker
      port:
        default: "1883"
        description: TCP port of the MQTT broker
    security:
      - $ref: "#/components/securitySchemes/userPassword"


##########################################################
## Channels                                             ##
##########################################################

channels:

  ##########################################################
  ## Device availability                                  ##
  ##########################################################

  clientAvailability:
    address: "FireFly/{uuid}/availability"
    description: Device-level availability for the client. Published as the MQTT Last Will and Testament (LWT) so the broker posts "offline" automatically when the connection drops.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      availability:
        $ref: "#/components/messages/availability"

  ##########################################################
  ## Diagnostic sensors                                   ##
  ##########################################################

  startTimeState:
    address: "FireFly/{uuid}/time-start/state"
    description: >
      Unix epoch timestamp (seconds) of when the client last booted. When NTP is synced this
      is the wall-clock time of boot; otherwise it is the number of seconds since boot. Published
      once on MQTT connect. Retained.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      startTimeState:
        $ref: "#/components/messages/epochTimestamp"

  ipAddressState:
    address: "FireFly/{uuid}/ip-address/state"
    description: Current IPv4 address of the client's WiFi interface. Published once on MQTT connect. Retained.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      ipAddressState:
        $ref: "#/components/messages/ipAddress"

  macAddressState:
    address: "FireFly/{uuid}/mac-address/state"
    description: WiFi MAC address of the client in uppercase colon-delimited hex notation. Published once on MQTT connect. Retained.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      macAddressState:
        $ref: "#/components/messages/macAddress"

  countErrorsState:
    address: "FireFly/{uuid}/count-errors/state"
    description: Cumulative count of active errors. Published on MQTT connect and whenever the error count changes. Retained.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      countErrorsState:
        $ref: "#/components/messages/errorCount"

  ##########################################################
  ## Certificate state                                    ##
  ##########################################################

  certState:
    address: "FireFly/{uuid}/cert/state"
    description: >
      SHA-256 fingerprint of the CA certificate currently stored on this client. Published on MQTT
      connect and again whenever the certificate is updated via the cert rotation broadcast.
      Retained. Operators can compare this value against the Controller's designated client
      certificate fingerprint to verify rotation has propagated to every device. Published as an
      empty string (or absent) when no certificate is loaded.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      certState:
        $ref: "#/components/messages/certState"

  ##########################################################
  ## OTA firmware update                                  ##
  ##########################################################

  updateState:
    address: "FireFly/{uuid}/update/state"
    description: >
      Firmware update status. Published when an update is available (with version metadata),
      when an install is in progress (with percentage), or retained after the last check.
      Retained.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      updateAvailable:
        $ref: "#/components/messages/updateAvailable"
      updateInProgress:
        $ref: "#/components/messages/updateInProgress"

  updateSet:
    address: "FireFly/{uuid}/update/set"
    description: Command topic to trigger a firmware OTA update. The client subscribes to this topic. Send the payload "do-update" to initiate the update.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      updateSet:
        $ref: "#/components/messages/updateSet"

  ##########################################################
  ## Home Assistant auto-discovery                        ##
  ##########################################################

  haDiscoverySensor:
    address: "{haRoot}/sensor/FireFly-{uuid}-{sensorId}/config"
    description: >
      Home Assistant MQTT sensor auto-discovery topic for a client diagnostic sensor entity.
      Published once on MQTT connect (retained) for each sensor: ip-address, mac-address,
      time-start, count-errors, and cert. Each message registers the sensor entity in Home
      Assistant and links it to the client device block.
    parameters:
      haRoot:
        $ref: "#/components/parameters/haRoot"
      uuid:
        $ref: "#/components/parameters/uuid"
      sensorId:
        $ref: "#/components/parameters/sensorId"
    messages:
      haDiscoverySensor:
        $ref: "#/components/messages/haDiscoverySensor"

  haDiscoveryUpdate:
    address: "{haRoot}/update/FireFly-{uuid}-update/config"
    description: Home Assistant MQTT discovery config for the firmware update entity. Published once after MQTT connect. Retained.
    parameters:
      haRoot:
        $ref: "#/components/parameters/haRoot"
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      haDiscoveryUpdate:
        $ref: "#/components/messages/haDiscoveryUpdate"

  ##########################################################
  ## Input state (subscribed from Controller)             ##
  ##########################################################

  inputState:
    address: "FireFly/inputs/{portId}/channels/{channelNumber}/state"
    description: >
      Input channel state published by the Controller when a button or switch changes state.
      The client subscribes to this topic for each configured HID channel at MQTT connect and
      adjusts the corresponding LED in response (see receiveInputState operation).
    parameters:
      portId:
        $ref: "#/components/parameters/portId"
      channelNumber:
        $ref: "#/components/parameters/channelNumber"
    messages:
      inputState:
        $ref: "#/components/messages/inputState"

  ##########################################################
  ## LED brightness control (subscribed)                  ##
  ##########################################################

  ledBrightnessSet:
    address: "FireFly/{uuid}/leds/brightness/set"
    description: >
      Command topic to set the brightness level of all configured LEDs on this client.
      The client subscribes to this topic at MQTT connect. The payload is a numeric brightness
      percentage (0–100) which is applied to all configured LED channels and stored as the
      retained brightness so subsequent button events restore to the commanded level.
    parameters:
      uuid:
        $ref: "#/components/parameters/uuid"
    messages:
      ledBrightnessSet:
        $ref: "#/components/messages/ledBrightnessSet"

  clientsBrightnessSet:
    address: "FireFly/clients/leds/brightness/set"
    description: >
      Broadcast command topic to set the brightness level of all configured LEDs on every
      connected client simultaneously. The client subscribes to this topic at MQTT connect.
      The payload is a numeric brightness percentage (0–100) which is applied to all configured
      LED channels and stored as the retained brightness so subsequent button events restore
      to the commanded level. Differs from ledBrightnessSet in that it targets all clients
      rather than a single device.
    messages:
      clientsBrightnessSet:
        $ref: "#/components/messages/ledBrightnessSet"

  ##########################################################
  ## Tag LED animation control (subscribed)               ##
  ##########################################################

  tagSet:
    address: "FireFly/tag/{tagName}/set"
    description: >
      Command topic for tag-driven LED animations. The client subscribes to one topic per
      unique tag found across all of its configured HID channels at MQTT connect. When a
      message is received, the commanded animation state is applied to every HID channel
      that carries that tag. Last-received command wins. Tag state persists across MQTT
      reconnects — the client re-subscribes on reconnect and resumes the last animation.
    parameters:
      tagName:
        $ref: "#/components/parameters/tagName"
    messages:
      tagSet:
        $ref: "#/components/messages/tagSet"

  ##########################################################
  ## Certificate rotation broadcast (subscribed)          ##
  ##########################################################

  clientCertBroadcast:
    address: "FireFly/clients/cert/state"
    description: >
      Retained broadcast published by the Controller whenever the client CA certificate is
      created, updated, or deleted. All clients subscribe to this topic. Because the message
      is retained, devices that are offline at rotation time receive the updated certificate
      automatically when they reconnect. If the fingerprint in the payload differs from the
      locally stored fingerprint, the client writes the new PEM to LittleFS, updates its
      in-memory BearSSL trust anchor, and publishes the new fingerprint to its per-device
      cert state topic.
    messages:
      clientCertBroadcast:
        $ref: "#/components/messages/clientCertBroadcast"


##########################################################
## Operations                                           ##
##########################################################

operations:

  ##########################################################
  ## Publish (client sends)                              ##
  ##########################################################

  publishClientAvailability:
    action: send
    channel:
      $ref: "#/channels/clientAvailability"
    summary: Publish device-level client availability
    description: >
      Published "online" when the client connects to the broker and "offline"
      as the MQTT Last Will and Testament when the connection drops unexpectedly.
      The retain flag is set so new subscribers immediately learn the current state.
    messages:
      - $ref: "#/channels/clientAvailability/messages/availability"

  publishStartTimeState:
    action: send
    channel:
      $ref: "#/channels/startTimeState"
    summary: Publish client boot timestamp
    description: >
      Published once on MQTT connect. Contains the Unix epoch timestamp (seconds) of when
      the device booted if NTP has synced, or seconds since boot if NTP is unavailable.
      The retain flag is set.
    messages:
      - $ref: "#/channels/startTimeState/messages/startTimeState"

  publishIpAddressState:
    action: send
    channel:
      $ref: "#/channels/ipAddressState"
    summary: Publish client IP address
    description: >
      Published once on MQTT connect. Contains the current IPv4 address of the WiFi interface
      as a dotted-decimal string. The retain flag is set.
    messages:
      - $ref: "#/channels/ipAddressState/messages/ipAddressState"

  publishMacAddressState:
    action: send
    channel:
      $ref: "#/channels/macAddressState"
    summary: Publish client MAC address
    description: >
      Published once on MQTT connect. Contains the WiFi MAC address in colon-delimited
      uppercase hex notation. The retain flag is set.
    messages:
      - $ref: "#/channels/macAddressState/messages/macAddressState"

  publishCountErrorsState:
    action: send
    channel:
      $ref: "#/channels/countErrorsState"
    summary: Publish active error count
    description: >
      Published on MQTT connect and whenever the error count changes (e.g., an OTA update
      failure increments the counter). The retain flag is set.
    messages:
      - $ref: "#/channels/countErrorsState/messages/countErrorsState"

  publishCertState:
    action: send
    channel:
      $ref: "#/channels/certState"
    summary: Publish current CA certificate fingerprint
    description: >
      Published once on MQTT connect (only when a certificate is loaded) and again whenever
      the certificate is updated via the cert rotation broadcast. The retain flag is set.
      Operators use this to verify cert rotation has reached every device.
    messages:
      - $ref: "#/channels/certState/messages/certState"

  publishUpdateState:
    action: send
    channel:
      $ref: "#/channels/updateState"
    summary: Publish firmware update status
    description: >
      Published when an OTA update is available (with version metadata), when an install
      is initiated or in progress (with percentage), or when the check confirms the current
      version is up to date. The retain flag is set.
    messages:
      - $ref: "#/channels/updateState/messages/updateAvailable"
      - $ref: "#/channels/updateState/messages/updateInProgress"

  publishHaDiscoverySensor:
    action: send
    channel:
      $ref: "#/channels/haDiscoverySensor"
    summary: Publish Home Assistant sensor discovery config for a diagnostic sensor entity
    description: >
      Published once after MQTT connect for each sensor entity (ip-address, mac-address,
      time-start, count-errors, cert). The retain flag is set. Five messages are published
      in total, one per sensorId.
    messages:
      - $ref: "#/channels/haDiscoverySensor/messages/haDiscoverySensor"

  publishHaDiscoveryUpdate:
    action: send
    channel:
      $ref: "#/channels/haDiscoveryUpdate"
    summary: Publish Home Assistant discovery config for the firmware update entity
    description: Published once after MQTT connect. The retain flag is set.
    messages:
      - $ref: "#/channels/haDiscoveryUpdate/messages/haDiscoveryUpdate"

  ##########################################################
  ## Subscribe (client receives)                         ##
  ##########################################################

  receiveInputState:
    action: receive
    channel:
      $ref: "#/channels/inputState"
    summary: Receive input channel state from the Controller
    description: >
      The client subscribes to this topic for each configured HID channel on MQTT connect.
      On receipt the client adjusts the corresponding LED:
        NORMAL — restore LED to its retained brightness (button at rest or released after SHORT).
        SHORT — turn LED off for the duration of the press (restored to retained on NORMAL).
        LONG — flash LED at full brightness for 100 ms, then hold at half of saved brightness
               (minimum 5% floor) until NORMAL is received.
        EXCESSIVE — flash LED 3 times at 100 ms on / 100 ms off, then restore retained brightness.
    messages:
      - $ref: "#/channels/inputState/messages/inputState"

  receiveLedBrightnessSet:
    action: receive
    channel:
      $ref: "#/channels/ledBrightnessSet"
    summary: Receive per-device LED brightness command
    description: >
      The client subscribes to this topic on MQTT connect. The payload is a numeric brightness
      percentage (0–100) applied immediately to all configured LEDs. The value is persisted as
      the retained brightness so subsequent button events restore to the commanded level rather
      than a hardcoded default.
    messages:
      - $ref: "#/channels/ledBrightnessSet/messages/ledBrightnessSet"

  receiveClientsBrightnessSet:
    action: receive
    channel:
      $ref: "#/channels/clientsBrightnessSet"
    summary: Receive all-clients LED brightness broadcast
    description: >
      The client subscribes to this topic on MQTT connect. Identical behavior to
      receiveLedBrightnessSet but targets every connected client simultaneously rather than
      a single device. The payload is a numeric brightness percentage (0–100) applied
      immediately to all configured LEDs and persisted as the retained brightness.
    messages:
      - $ref: "#/channels/clientsBrightnessSet/messages/clientsBrightnessSet"

  receiveUpdateSet:
    action: receive
    channel:
      $ref: "#/channels/updateSet"
    summary: Receive firmware update install command
    description: >
      The client subscribes to this topic on MQTT connect. Send "do-update" to trigger an OTA
      firmware update. Any other payload is ignored. On receipt the client immediately calls the
      OTA check routine; if a newer version is available the update is downloaded and the device
      reboots on success.
    messages:
      - $ref: "#/channels/updateSet/messages/updateSet"

  receiveTagSet:
    action: receive
    channel:
      $ref: "#/channels/tagSet"
    summary: Receive tag LED animation command
    description: >
      The client subscribes to one topic per unique tag across all of its configured HID
      channels. On receipt, the commanded animation state is applied to every channel that
      carries the tag. A button press on an animating LED still follows normal button-state
      LED behavior; on button release (NORMAL) the tag animation resumes. Last-received
      command wins when multiple tag topics fire on the same channel.
    messages:
      - $ref: "#/channels/tagSet/messages/tagSet"

  receiveClientCertBroadcast:
    action: receive
    channel:
      $ref: "#/channels/clientCertBroadcast"
    summary: Receive CA certificate rotation broadcast
    description: >
      The client subscribes to this topic on MQTT connect. Because the message is retained by the
      broker, devices that were offline at rotation time receive it automatically on reconnect. If
      the fingerprint in the payload differs from the locally stored fingerprint, the client writes
      the new PEM to LittleFS, updates its in-memory BearSSL trust anchor, publishes the updated
      fingerprint to its per-device cert state topic, and re-publishes HA auto-discovery payloads
      so the cert metadata fields in the device block are refreshed.
    messages:
      - $ref: "#/channels/clientCertBroadcast/messages/clientCertBroadcast"


##########################################################
## Components                                           ##
##########################################################

components:

  ##########################################################
  ## Security                                             ##
  ##########################################################

  securitySchemes:
    userPassword:
      type: userPassword
      description: Username and password credentials for the MQTT broker

  ##########################################################
  ## Parameters                                           ##
  ##########################################################

  parameters:

    uuid:
      description: UUIDv4 uniquely identifying this client, stored in EEPROM during manufacturing
      examples:
        - 3fa85f64-5717-4562-b3fc-2c963f66afa6

    portId:
      description: >
        Human-assigned alphanumeric identifier for an input port on the Controller
        (max 8 characters, pattern [A-Za-z0-9~!@#$%^&*()_+-=|]{1,8}). Matches the portId
        parameter in the Controller AsyncAPI spec. The client receives this value in the
        provisioning payload as the root "id" field.
      examples:
        - S16
        - S22

    channelNumber:
      description: >
        Input channel number within the port (1–6). Equals the HID key number in the
        provisioning payload and in the config.json hids object.
      examples:
        - "1"
        - "6"

    sensorId:
      description: >
        Short string identifying the Home Assistant sensor entity for a diagnostic measurement.
        Used in the auto-discovery topic to give each sensor entity a unique, stable identifier.
      examples:
        - ip-address
        - mac-address
        - time-start
        - count-errors
        - cert

    tagName:
      description: >
        Tag label assigned to one or more HID channels in the client configuration.
        Tags are arbitrary strings (1–20 characters). A client subscribes to one topic
        per unique tag across all of its configured HID channels.
      examples:
        - Security
        - Holiday

    haRoot:
      description: >
        Home Assistant MQTT discovery root topic prefix. Defaults to "homeassistant"
        but can be changed in the Home Assistant MQTT integration settings.
      default: homeassistant

  ##########################################################
  ## Messages                                             ##
  ##########################################################

  messages:

    availability:
      name: availability
      title: Availability
      summary: Indicates whether the device is online or offline
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/availabilityPayload"
      examples:
        - name: online
          payload: online
        - name: offline
          payload: offline

    epochTimestamp:
      name: epochTimestamp
      title: Unix Epoch Timestamp
      summary: A Unix epoch time value in seconds, encoded as a decimal string
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/epochTimestampPayload"
      examples:
        - name: typical
          payload: "1709398094"

    ipAddress:
      name: ipAddress
      title: IPv4 Address
      summary: An IPv4 address in dotted-decimal notation
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/ipAddressPayload"
      examples:
        - name: typical
          payload: "192.168.10.101"

    macAddress:
      name: macAddress
      title: MAC Address
      summary: A WiFi MAC address in uppercase colon-delimited hex notation
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/macAddressPayload"
      examples:
        - name: typical
          payload: "A1:B2:C3:D4:E5:F6"

    errorCount:
      name: errorCount
      title: Active Error Count
      summary: Number of active (unresolved) errors
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/errorCountPayload"
      examples:
        - name: no-errors
          payload: "0"
        - name: two-errors
          payload: "2"

    certState:
      name: certState
      title: Certificate Fingerprint State
      summary: SHA-256 fingerprint of the CA certificate currently stored on this client
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/certFingerprintPayload"
      examples:
        - name: typical
          payload: "AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99"

    updateAvailable:
      name: updateAvailable
      title: Firmware Update Available
      summary: Firmware update status with version information and optional progress
      contentType: application/json
      payload:
        $ref: "#/components/schemas/updateStatePayload"
      examples:
        - name: update-available
          payload:
            installed_version: "2025.04.01"
            latest_version: "2025.05.01"
            title: "FireFly Client 2025.05.01"
            release_url: "https://docs.fireflylx.com/releases/2025.05.01"
            in_progress: false
            update_percentage: 0
        - name: no-update
          payload:
            installed_version: "2025.05.01"
            latest_version: "2025.05.01"
            in_progress: false

    updateInProgress:
      name: updateInProgress
      title: Firmware Update In Progress
      summary: Firmware OTA update is actively downloading
      contentType: application/json
      payload:
        $ref: "#/components/schemas/updateStatePayload"
      examples:
        - name: mid-way
          payload:
            installed_version: "2025.04.01"
            latest_version: "2025.05.01"
            in_progress: true
            update_percentage: 42

    updateSet:
      name: updateSet
      title: Firmware Update Install Command
      summary: Command to trigger a firmware OTA update
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/updateSetPayload"
      examples:
        - name: install
          payload: do-update

    inputState:
      name: inputState
      title: Input Channel State
      summary: The current state of an input channel as published by the Controller
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/inputStatePayload"
      examples:
        - name: normal
          payload: NORMAL
        - name: short
          payload: SHORT
        - name: long
          payload: LONG
        - name: excessive
          payload: EXCESSIVE

    ledBrightnessSet:
      name: ledBrightnessSet
      title: LED Brightness Set Command
      summary: Command to set the global brightness of all configured LED channels (0–100)
      contentType: text/plain
      payload:
        $ref: "#/components/schemas/ledBrightnessSetPayload"
      examples:
        - name: full
          payload: "100"
        - name: half
          payload: "50"
        - name: off
          payload: "0"

    tagSet:
      name: tagSet
      title: Tag LED Animation Command
      summary: Command to apply a named LED animation state to all HID channels carrying the tag
      contentType: application/json
      payload:
        $ref: "#/components/schemas/tagSetPayload"
      examples:
        - name: blink
          payload:
            state: blink
            brightness: 75
        - name: snore
          payload:
            state: snore
        - name: normal
          payload:
            state: normal

    clientCertBroadcast:
      name: clientCertBroadcast
      title: CA Certificate Rotation Broadcast
      summary: Broadcast payload from the Controller containing an updated CA certificate for all clients
      contentType: application/json
      payload:
        $ref: "#/components/schemas/clientCertBroadcastPayload"
      examples:
        - name: rotation
          payload:
            fingerprint: "AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99"
            pem: "-----BEGIN CERTIFICATE-----\nMIID...base64...\n-----END CERTIFICATE-----\n"

    haDiscoverySensor:
      name: haDiscoverySensor
      title: Home Assistant Discovery — Client Sensor Entity
      summary: Home Assistant MQTT discovery payload for a client diagnostic sensor entity
      contentType: application/json
      payload:
        $ref: "#/components/schemas/haDiscoverySensorPayload"

    haDiscoveryUpdate:
      name: haDiscoveryUpdate
      title: Home Assistant Discovery — Firmware Update Entity
      summary: Home Assistant MQTT discovery payload for the firmware update entity
      contentType: application/json
      payload:
        $ref: "#/components/schemas/haDiscoveryUpdatePayload"

  ##########################################################
  ## Schemas                                              ##
  ##########################################################

  schemas:

    availabilityPayload:
      type: string
      enum:
        - online
        - offline
      description: Online/offline availability string

    inputStatePayload:
      type: string
      enum:
        - NORMAL
        - SHORT
        - LONG
        - EXCESSIVE
      description: >
        Current state of an input channel as published by the Controller.
        NORMAL = button at rest or released — client restores LED to retained brightness.
        SHORT = brief press/release — client turns LED off.
        LONG = held beyond short-press threshold — client flashes LED full then holds at half brightness.
        EXCESSIVE = press count exceeded maximum — client flashes LED 3 times at 100 ms on/off.

    epochTimestampPayload:
      type: string
      description: Unix epoch time in seconds as a decimal string
      examples:
        - "1709398094"

    ipAddressPayload:
      type: string
      description: IPv4 address in dotted-decimal notation
      examples:
        - "192.168.10.101"

    macAddressPayload:
      type: string
      description: WiFi MAC address in uppercase colon-delimited hex notation
      pattern: "^([0-9A-F]{2}:){5}[0-9A-F]{2}$"
      examples:
        - "A1:B2:C3:D4:E5:F6"

    errorCountPayload:
      type: string
      description: Count of active unresolved errors as a decimal string
      examples:
        - "0"
        - "2"

    certFingerprintPayload:
      type: string
      description: SHA-256 fingerprint of the loaded CA cert as colon-separated uppercase hex; empty string when no cert is loaded
      examples:
        - "AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99"

    updateStatePayload:
      type: object
      description: >
        Firmware update status message. Published when an update is available, when an install
        is in progress, or when the current version is confirmed to be the latest.
      required:
        - installed_version
        - latest_version
        - in_progress
      properties:
        installed_version:
          type: string
          description: Currently installed firmware version string
          examples:
            - "2025.04.01"
        latest_version:
          type: string
          description: Latest available firmware version string as returned by the OTA server
          examples:
            - "2025.05.01"
        in_progress:
          type: boolean
          description: Whether a firmware install is currently in progress
        update_percentage:
          type: integer
          description: >
            Install progress as a straight percentage (0–100). For example, 42 means 42% complete.
            This differs from the Controller which encodes progress as percentage×100.
            Present during an active download; may be 0 when update is available but not started.
          minimum: 0
          maximum: 100
        title:
          type: string
          description: Human-readable release title from the OTA manifest (optional)
          examples:
            - "FireFly Client 2025.05.01"
        release_url:
          type: string
          description: URL to the full release notes from the OTA manifest (optional)

    updateSetPayload:
      type: string
      description: Command payload to initiate a firmware OTA update
      enum:
        - do-update

    ledBrightnessSetPayload:
      type: string
      description: Global LED brightness as a decimal integer string (0–100)
      examples:
        - "0"
        - "50"
        - "100"

    tagSetPayload:
      type: object
      description: >
        Tag LED animation command payload. Applies the named animation state to every HID
        channel on this client that carries the matching tag.
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - snore
            - blink
            - blink-rapid
            - normal
          description: >
            Animation to apply.
            snore = smooth PWM fade up then down continuously (~6 s full cycle at full brightness).
            blink = hard on/off toggle at 750 ms intervals.
            blink-rapid = hard on/off toggle at 375 ms intervals.
            normal = cancel tag animation and restore the channel's defaultBrightness.
        brightness:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            LED brightness percentage to use during the animation (0–100). Ignored when state
            is normal. If omitted, the channel's defaultBrightness from config is used.
      examples:
        - state: blink
          brightness: 75
        - state: snore
        - state: normal

    clientCertBroadcastPayload:
      type: object
      description: >
        CA certificate rotation payload broadcast by the Controller to all clients.
        Matches the Controller's clientCertStatePayload schema.
      required:
        - fingerprint
        - pem
      properties:
        fingerprint:
          type: string
          description: SHA-256 fingerprint of the certificate in colon-separated uppercase hex pairs
          examples:
            - "AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99"
        pem:
          type: string
          description: Full PEM-encoded CA certificate text including BEGIN/END markers and newlines

    haClientDevice:
      type: object
      description: Home Assistant device grouping block linking all client entities together in the HA device registry
      properties:
        identifiers:
          type: array
          items:
            type: string
          description: Single-element array containing the device identifier in the format "FireFly-{uuid}", matching the identifier the Controller publishes in its input-channel auto-discovery payloads for paired ports so Home Assistant groups both sets of entities on a single device card
        name:
          type: string
          description: Human-friendly device name read from config.json
        manufacturer:
          type: string
          const: "P5 Software LLC"
        model:
          type: string
          const: "FireFly Client"
        model_id:
          type: string
          description: Product identifier from EEPROM (e.g., FFI0600-2011)
        serial_number:
          type: string
          description: UUID of this client, used as the serial number
        sw_version:
          type: string
          description: Firmware version string (e.g., "2025.04.01" or "DEBUG")
        suggested_area:
          type: string
          description: Suggested area from config.json; omitted if not configured
        cert_common_name:
          type: string
          description: Common Name (CN) field from the loaded CA certificate; omitted when no cert is loaded
        cert_organization:
          type: string
          description: Organization (O) field from the loaded CA certificate; omitted when no cert is loaded
        cert_expiration:
          type: string
          description: Expiration date of the loaded CA certificate in ISO format "YYYY-MM-DD"; omitted when no cert is loaded

    haDiscoverySensorPayload:
      type: object
      description: >
        Home Assistant MQTT discovery payload for a client diagnostic sensor entity.
        Structure follows the Home Assistant MQTT sensor discovery specification.
      properties:
        unique_id:
          type: string
          description: Globally unique entity identifier (format "FireFly-{uuid}-{sensorId}")
        name:
          type: string
          description: Human-readable entity name (e.g., "IP Address", "MAC Address")
        state_topic:
          type: string
          description: MQTT topic where this sensor's state is published
        availability_topic:
          type: string
          description: MQTT topic used for availability (FireFly/{uuid}/availability)
        icon:
          type: string
          description: MDI icon reference (e.g., "mdi:ip", "mdi:ethernet", "mdi:clock-start", "mdi:alert-circle", "mdi:certificate")
        device:
          $ref: "#/components/schemas/haClientDevice"

    haDiscoveryUpdatePayload:
      type: object
      description: >
        Home Assistant MQTT discovery payload for the firmware update entity.
        Structure follows the Home Assistant MQTT update discovery specification.
      properties:
        unique_id:
          type: string
          description: Globally unique entity identifier (format "FireFly-{uuid}-update")
        name:
          type: string
          description: Entity display name (always "Firmware Update")
        state_topic:
          type: string
          description: MQTT topic where the update state is published (FireFly/{uuid}/update/state)
        command_topic:
          type: string
          description: MQTT topic where the install command is sent (FireFly/{uuid}/update/set)
        payload_install:
          type: string
          const: "do-update"
          description: The payload that triggers an OTA firmware update
        availability_topic:
          type: string
          description: MQTT topic used for availability (FireFly/{uuid}/availability)
        device:
          $ref: "#/components/schemas/haClientDevice"
